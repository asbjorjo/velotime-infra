apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gateway-tls
  namespace: gateway-system
spec:
  secretName: gateway-tls
  # TODO: replace with the real hostname once DNS points at this Gateway's address.
  dnsNames:
    - development.veloti.me
    - auth.development.veloti.me
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer

apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway
  namespace: gateway-system
spec:
  gatewayClassName: cilium
  listeners:
    - name: port-80
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    # https listener intentionally omitted until the gateway-tls secret exists; re-add it referencing that secret once cert-manager has issued it.

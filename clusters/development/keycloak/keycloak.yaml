apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
spec:
  instances: 1
  db:
    vendor: postgres
    usernameSecret:
      name: keycloak-db-secret
      key: username
    passwordSecret:
      name: keycloak-db-secret
      key: password
  additionalOptions:
    - name: db-url-host
      secret:
        name: keycloak-db-secret
        key: host
    - name: db-url-port
      secret:
        name: keycloak-db-secret
        key: port
    - name: db-url-database
      secret:
        name: keycloak-db-secret
        key: database
  http:
    httpEnabled: true
  hostname:
    hostname: https://auth.development.veloti.me
  ingress:
    enabled: false
  resources:
    requests:
      memory: 512Mi
    limits:
      memory: 1Gi
  proxy:
    headers: xforwarded

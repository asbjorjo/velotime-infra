apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: database-metrics
  namespace: velotime-instrumentation
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault
  target:
    name: database-metrics
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_HOST
      remoteRef:
        key: velotime-database-host
    - secretKey: CACHE_HOST
      remoteRef:
        key: velotime-cache-host
    - secretKey: DATABASE_METRICS_USER
      remoteRef:
        key: database-metrics-user
    - secretKey: DATABASE_METRICS_PASSWORD
      remoteRef:
        key: database-metrics-password
    - secretKey: CACHE_METRICS_USER
      remoteRef:
        key: cache-metrics-user
    - secretKey: CACHE_METRICS_PASSWORD
      remoteRef:
        key: cache-metrics-password

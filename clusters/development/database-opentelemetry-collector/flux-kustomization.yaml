apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: database-opentelemetry-collector
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  path: ./clusters/development/database-opentelemetry-collector
  prune: true
  dependsOn:
    - name: services
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: database-telemetry-collector
      namespace: velotime-instrumentation
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m

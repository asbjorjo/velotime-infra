apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: flux-system
spec:
  values:
    # Captured from the existing UpCloud release before Flux adoption.
    ipam:
      mode: cluster-pool
      operator:
        clusterPoolIPv4PodCIDRList:
          - 192.168.0.0/16
    k8sServiceHost: auto
    k8sServicePort: 6443
    kubeProxyReplacement: true
    upgradeCompatibility: "1.8"

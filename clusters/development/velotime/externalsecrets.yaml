apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velotime-module-facilities-api
  namespace: velotime
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault
  target:
    name: velotime-module-facilities-api
    creationPolicy: Owner
  data:
    - secretKey: CACHE_PASSWORD
      remoteRef:
        key: velotime-cache-password
    - secretKey: CACHE_URI
      remoteRef:
        key: velotime-cache-uri
    - secretKey: VELOTIMEDB_PASSWORD
      remoteRef:
        key: velotime-database-password
    - secretKey: VELOTIMEDB_URI
      remoteRef:
        key: velotime-database-uri
    - secretKey: ConnectionStrings__cache
      remoteRef:
        key: velotime-cache-connection-string
    - secretKey: ConnectionStrings__velotimedb
      remoteRef:
        key: velotime-database-connection-string
---

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velotime
  namespace: flux-system
spec:
  interval: 1h
  releaseName: velotime
  targetNamespace: velotime
  storageNamespace: velotime
  timeout: 10m
  chart:
    spec:
      chart: ./charts/velotime
      sourceRef:
        kind: GitRepository
        name: velotime
        namespace: flux-system
      interval: 1h
      reconcileStrategy: "Revision"
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    global:
      image:
        repository: ghcr.io/asbjorjo/
      imagePullSecrets:
        - name: ghcr
      oidcAudience: https://development.veloti.me
    module-facilities-api:
      existingSecret: module-facilities-api
    module-statistics-api:
      existingSecret: module-statistics-api
    module-statistics-processor:
      replicaCount: 0
      existingSecret: module-statistics-processor
    module-timing-api:
      existingSecret: module-timing-api
    module-timing-processor:
      replicaCount: 0
      existingSecret: module-timing-processor
    webui:
      existingSecret: webui
      httpRoute:
        parentRefs:
          - name: gateway
            namespace: gateway-system
        hostnames:
          - development.veloti.me
    valkey:
      replicaCount: 0

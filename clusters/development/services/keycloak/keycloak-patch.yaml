apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
spec:
  hostname:
    hostname: https://auth.development.veloti.me
  tracing:
    enabled: true
    endpoint: http://telemetry-collector.velotime-instrumentation.svc.cluster.local:4317
    samplerType: traceidratio
    samplerRatio: 1.0

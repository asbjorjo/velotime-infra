apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-db-grant-permissions
  namespace: keycloak
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: grant
          image: postgres:18-alpine
          command:
            - psql
            - -v
            - ON_ERROR_STOP=1
            - -c
            - GRANT ALL PRIVILEGES ON SCHEMA public TO "$(KEYCLOAK_DB_USER)";
          env:
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-secret
                  key: host
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-secret
                  key: port
            - name: KEYCLOAK_DB_USER
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-secret
                  key: username
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-secret
                  key: database
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-admin-secret
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-admin-secret
                  key: password

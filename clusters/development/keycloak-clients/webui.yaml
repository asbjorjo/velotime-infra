apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakOIDCClient
metadata:
  name: velotime.webui
  namespace: keycloak
spec:
  keycloakCRName: keycloak
  realm: velotime
  client:
    displayName: VeloTime Web UI
    enabled: true
    appUrl: https://development.veloti.me
    loginFlows:
      - STANDARD
    redirectUris:
      - https://development.veloti.me/signin-oidc
      - https://development.veloti.me/signout-callback-oidc
    webOrigins:
      - https://development.veloti.me
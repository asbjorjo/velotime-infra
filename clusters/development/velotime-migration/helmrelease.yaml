apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velotime-migration
  namespace: flux-system
spec:
  interval: 1h
  releaseName: velotime-migration
  targetNamespace: velotime
  storageNamespace: velotime
  timeout: 10m
  chart:
    spec:
      chart: ./app/velotime-migration
      sourceRef:
        kind: GitRepository
        name: velotime
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    global:
      image:
        repository: ghcr.io/asbjorjo/
        tag: 3.0.0-alpha.62
      imagePullSecrets:
        - name: ghcr
    velotime-users-migration:
      existingSecret: velotime-users-migration
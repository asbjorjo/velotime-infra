apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: velotime-migration
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  path: ./clusters/development/velotime-migration
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: velotime-secrets
    - name: velotime-db-grant
    - name: velotime-bootstrap
    - name: keycloak
  timeout: 10m
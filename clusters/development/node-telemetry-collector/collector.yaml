apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: node-telemetry
  namespace: velotime-instrumentation
spec:
  mode: daemonset
  image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s:0.162.0
  serviceAccount: node-telemetry
  podAnnotations:
    telemetry.velotime.io/collector: node-agent
  env:
    - name: K8S_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: K8S_NODE_IP
      valueFrom:
        fieldRef:
          fieldPath: status.hostIP
  resources:
    requests:
      memory: 256Mi
    limits:
      memory: 512Mi
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    privileged: false
    readOnlyRootFilesystem: true
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: host-root
      hostPath:
        path: /
        type: Directory
  volumeMounts:
    - name: host-root
      mountPath: /hostfs
      readOnly: true
  config:
    receivers:
      kubeletstats:
        collection_interval: 30s
        auth_type: serviceAccount
        endpoint: https://${env:K8S_NODE_IP}:10250
        insecure_skip_verify: true
      hostmetrics:
        collection_interval: 30s
        root_path: /hostfs
        scrapers:
          cpu: {}
          disk:
            exclude:
              devices:
                - "^loop[0-9]+$"
              match_type: regexp
          filesystem:
            exclude_mount_points:
              mount_points:
                - "^/proc($|/)"
                - "^/sys($|/)"
                - "^/dev($|/)"
                - "^/run($|/)"
              match_type: regexp
          memory: {}
          network:
            exclude:
              interfaces:
                - "^lo$"
              match_type: regexp
    processors:
      memory_limiter:
        check_interval: 5s
        limit_mib: 384
        spike_limit_mib: 64
      resource/node:
        attributes:
          - key: k8s.node.name
            value: ${env:K8S_NODE_NAME}
            action: upsert
      batch:
        timeout: 5s
        send_batch_size: 1024
    exporters:
      otlp:
        endpoint: telemetry-collector.velotime-instrumentation.svc.cluster.local:4317
        tls:
          insecure: true
        sending_queue:
          enabled: true
          num_consumers: 2
          queue_size: 256
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 5m
    service:
      pipelines:
        metrics:
          receivers:
            - kubeletstats
            - hostmetrics
          processors:
            - memory_limiter
            - resource/node
            - batch
          exporters:
            - otlp

apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: azure-keyvault
spec:
  provider:
    azurekv:
      authType: ServicePrincipal
      vaultUrl: https://velotime-development.vault.azure.net
      # Not derivable from the authSecretRef Secret; ESO requires it as a plain spec field.
      tenantId: fb7d2065-0b50-411a-b713-3c19b71752b5
      authSecretRef:
        clientId:
          name: external-secrets-azure-config
          namespace: external-secrets
          key: clientId
        clientSecret:
          name: external-secrets-azure-config
          namespace: external-secrets
          key: clientSecret

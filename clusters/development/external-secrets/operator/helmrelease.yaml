apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 1h
  releaseName: external-secrets
  targetNamespace: external-secrets
  storageNamespace: external-secrets
  timeout: 5m
  chart:
    spec:
      chart: external-secrets
      version: "2.10.0"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 0
  upgrade:
    remediation:
      retries: 0
  values:
    # CRDs are deployed separately by the external-secrets-crds Kustomization to avoid the webhook race condition.
    crds:
      create: false

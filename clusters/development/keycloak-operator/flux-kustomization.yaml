apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: keycloak-operator-resources
  namespace: flux-system
spec:
  interval: 1h
  url: https://github.com/keycloak/keycloak-k8s-resources.git
  ref:
    tag: 26.7.4
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keycloak-operator
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  path: ./kubernetes
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: keycloak-operator-resources
  dependsOn:
    - name: keycloak-namespace
  timeout: 10m

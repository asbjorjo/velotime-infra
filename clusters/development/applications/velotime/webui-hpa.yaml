apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: velotime-webui
  namespace: velotime
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: velotime-webui
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: ContainerResource
      containerResource:
        name: memory
        container: webui
        target:
          type: Utilization
          averageUtilization: 90

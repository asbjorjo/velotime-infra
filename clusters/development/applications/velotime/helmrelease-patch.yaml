apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velotime
  namespace: flux-system
spec:
  values:
    global:
      oidcAudience: https://development.veloti.me
      oidcAuthority: https://auth.development.veloti.me/
    webui:
      httpRoute:
        hostnames:
          - development.veloti.me
    valkey:
      replicaCount: 0
    messageBusTopology:
      topics:
        - name: velotime-agent
          subscriptions:
            - name: timing
              requiresSession: true
              rules:
                - name: PassingEvent
                  sqlFilter: MessageName = 'PassingEvent'
            - name: infrastructure
              requiresSession: false
              rules:
                - name: InstallationLayoutEvent
                  sqlFilter: MessageName = 'InstallationLayoutEvent'
                - name: LoopStatusEvent
                  sqlFilter: MessageName = 'LoopStatusEvent'
            - name: x2-sola-dev
              requiresSession: false
              rules:
                - name: PauseAgentCommand
                  sqlFilter: MessageName = 'PauseAgentCommand'
                - name: ResumeAgentCommand
                  sqlFilter: MessageName = 'ResumeAgentCommand'
        - name: velotime-timing
          subscriptions:
            - name: statistics
              requiresSession: true
              rules:
                - name: TimingSampleComplete
                  sqlFilter: MessageName = 'TimingSampleComplete'
                - name: TransponderOwnershipChanged
                  sqlFilter: MessageName = 'TransponderOwnershipChanged'
        - name: velotime-statistics
          subscriptions:
            - name: statistics
              requiresSession: true
              rules:
                - name: EntryCreated
                  sqlFilter: MessageName = 'EntryCreated'
                - name: SampleComplete
                  sqlFilter: MessageName = 'SampleComplete'
            - name: statistics-validity
              requiresSession: false
              rules:
                - name: StatisticsValidityThresholdsChangedV1
                  sqlFilter: MessageName = 'StatisticsValidityThresholdsChangedV1'
        - name: velotime-facilities
          subscriptions: []
        - name: velotime-notifications
          subscriptions:
            - name: webui-notifications
              requiresSession: false
              rules:
                - name: NotificationsRefreshRequestedV1
                  sqlFilter: MessageName = 'NotificationsRefreshRequestedV1'
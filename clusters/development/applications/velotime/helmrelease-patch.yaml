apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velotime
  namespace: flux-system
spec:
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: velotime-webui
            patch: |-
              - op: replace
                path: /spec/replicas
                value: 2
  values:
    global:
      oidcAudience: https://development.veloti.me
      oidcAuthority: https://auth.development.veloti.me/
    webui:
      resources:
        requests:
          memory: 256Mi
      httpRoute:
        hostnames:
          - development.veloti.me
    valkey:
      replicaCount: 0
    messageBusTopology:
      topics:
        - name: velotime-agent
          subscriptions:
            - name: timing
              requiresSession: true
              rules:
                - name: PassingObservedV1
                  sqlFilter: MessageName = 'PassingObservedV1'
            - name: infrastructure
              requiresSession: false
              rules:
                - name: InstallationLayoutEvent
                  sqlFilter: MessageName = 'InstallationLayoutEvent'
                - name: LoopStatusEvent
                  sqlFilter: MessageName = 'LoopStatusEvent'
            - name: x2-sola-dev
              requiresSession: false
              rules:
                - name: PauseAgentCommand
                  sqlFilter: MessageName = 'PauseAgentCommand'
                - name: ResumeAgentCommand
                  sqlFilter: MessageName = 'ResumeAgentCommand'
        - name: velotime-timing
          subscriptions:
            - name: statistics
              requiresSession: true
              rules:
                - name: PassingRecordedV1
                  sqlFilter: MessageName = 'PassingRecordedV1'
                - name: TransponderOwnershipChanged
                  sqlFilter: MessageName = 'TransponderOwnershipChanged'
                - name: InstallationFacilityChangedV1
                  sqlFilter: MessageName = 'InstallationFacilityChangedV1'
        - name: velotime-facilities
          subscriptions:
            - name: statistics
              requiresSession: true
              rules:
                - name: CourseConfigChangedV1
                  sqlFilter: MessageName = 'CourseConfigChangedV1'
        - name: velotime-notifications
          subscriptions:
            - name: webui-notifications
              requiresSession: false
              rules:
                - name: NotificationsRefreshRequestedV1
                  sqlFilter: MessageName = 'NotificationsRefreshRequestedV1'

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: flux-system
spec:
  interval: 1h
  releaseName: cilium
  # UpCloud Managed Kubernetes installs this release out-of-band; adopt it in place rather than reinstalling.
  targetNamespace: kube-system
  storageNamespace: kube-system
  timeout: 5m
  chart:
    spec:
      chart: cilium
      version: "1.18.14"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 0
  upgrade:
    remediation:
      retries: 0
    crds: CreateReplace
  # Captured from `helm -n kube-system get values cilium -o yaml` prior to Flux adoption; gatewayAPI is layered on via patch-gateway-api.yaml.
  values:
    ipam:
      mode: cluster-pool
      operator:
        clusterPoolIPv4PodCIDRList:
          - 192.168.0.0/16
    k8sServiceHost: auto
    k8sServicePort: 6443
    kubeProxyReplacement: true
    # upgradeCompatibility: "1.8"
    # gatewayAPI:
    #   enabled: true

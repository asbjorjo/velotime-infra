apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
  distribution:
    version: 2.x
    registry: ghcr.io/fluxcd
  cluster:
    type: kubernetes
    size: small
  sync:
    kind: GitRepository
    url: https://github.com/asbjorjo/velotime-infra.git
    ref: refs/heads/main
    path: clusters/development
    pullSecret: flux-system

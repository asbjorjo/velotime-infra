apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-dns-namespace
  namespace: flux-system
spec:
  interval: 1h
  path: ./clusters/development/external-dns-namespace
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
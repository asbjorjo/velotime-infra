apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-realm-client-secrets
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault
  target:
    name: keycloak-realm-client-secrets
    creationPolicy: Owner
    template:
      metadata:
        labels:
          operator.keycloak.org/kind: KeycloakOIDCClient
  data:
    - secretKey: users-migration
      remoteRef:
        key: velotime-migration-users-secret
    - secretKey: statistics-processor
      remoteRef:
        key: velotime-statistics-secret
    - secretKey: timing-processor
      remoteRef:
        key: velotime-timing-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-bootstrap-admin
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault
  target:
    name: keycloak-bootstrap-admin
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        client-id: velotime-bootstrap-admin
        client-secret: "{{ .secret }}"
  data:
    - secretKey: secret
      remoteRef:
        key: keycloak-bootstrap-admin-client-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-admin
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault
  target:
    name: keycloak-admin
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        client-id: velotime-operator
        client-secret: "{{ .secret }}"
  data:
    - secretKey: secret
      remoteRef:
        key: keycloak-operator-client-secret
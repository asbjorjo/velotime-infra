apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keycloak-realm-secrets
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  path: ./clusters/development/keycloak-realm-secrets
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: keycloak-namespace
    - name: external-secrets-crs
  timeout: 10m
          sudo dpkg -i upcloud-cli_3.36.0_amd64.deb

      - name: Modify Cluster Admin IP Filter
        env:
          UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_TOKEN }}
        run: upctl kubernetes modify production-cluster --kubernetes-api-allow-ip ${{ steps.runner-ip.outputs.runner_ip }}

      - name: OpenTofu Init
        id: init
        run: |
          tofu -chdir=terraform init -input=false \
            -backend-config="bucket=production" \
            -backend-config="region=${{ vars.BACKEND_REGION }}" \
            -backend-config="endpoints={s3=\"${{ vars.BACKEND_ENDPOINT }}\"}" \
            -backend-config="skip_region_validation=true"

      - name: OpenTofu Apply
        id: apply
        run: tofu -chdir=terraform apply -auto-approve -input=false

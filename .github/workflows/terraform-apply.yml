name: "OpenTofu Deploy"

on:
  push:
    branches:
      - main
    paths:
      - terraform/**
      - flux-bootstrap/**

permissions:
  contents: read

jobs:
  development-plan:
    name: "OpenTofu Plan (development)"
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: opentofu-plan-development
      cancel-in-progress: false

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.UPCLOUD_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.UPCLOUD_S3_SECRET_ACCESS_KEY }}
      UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_TOKEN }}
      TF_VAR_ssh_keys: ${{ secrets.CLUSTER_SSH_KEYS }}
      TF_VAR_admin_ip_filter: ${{ vars.ADMIN_IP_FILTER }}
      TF_VAR_cache_db_username: ${{ secrets.CACHE_DB_USERNAME }}
      TF_VAR_cache_db_password: ${{ secrets.CACHE_DB_PASSWORD }}
      TF_VAR_database_username: ${{ secrets.DATABASE_USERNAME }}
      TF_VAR_database_password: ${{ secrets.DATABASE_PASSWORD }}
      TF_VAR_azure_eso_object_id: ${{ vars.AZURE_ESO_OBJECT_ID }}
      ARM_CLIENT_ID: ${{ vars.AZURE_TF_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.12.5"

      - name: OpenTofu Init
        id: init
        run: |
          tofu -chdir=terraform init -input=false \
            -backend-config="bucket=development" \
            -backend-config="region=${{ vars.BACKEND_REGION }}" \
            -backend-config="endpoints={s3=\"${{ vars.BACKEND_ENDPOINT }}\"}" \
            -backend-config="skip_region_validation=true"

      - name: OpenTofu Validate
        id: validate
        run: tofu -chdir=terraform validate -no-color

      - name: OpenTofu Plan
        id: plan
        run: tofu -chdir=terraform plan -no-color -input=false -var-file=environments/development.tfvars

  development-apply:
    name: "OpenTofu Apply (development)"
    needs: development-plan
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: opentofu-apply-development
      cancel-in-progress: false

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.UPCLOUD_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.UPCLOUD_S3_SECRET_ACCESS_KEY }}
      UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_TOKEN }}
      TF_VAR_ssh_keys: ${{ secrets.CLUSTER_SSH_KEYS }}
      TF_VAR_admin_ip_filter: ${{ vars.ADMIN_IP_FILTER }}
      TF_VAR_cache_db_username: ${{ secrets.CACHE_DB_USERNAME }}
      TF_VAR_cache_db_password: ${{ secrets.CACHE_DB_PASSWORD }}
      TF_VAR_database_username: ${{ secrets.DATABASE_USERNAME }}
      TF_VAR_database_password: ${{ secrets.DATABASE_PASSWORD }}
      TF_VAR_azure_eso_object_id: ${{ vars.AZURE_ESO_OBJECT_ID }}
      ARM_CLIENT_ID: ${{ vars.AZURE_TF_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.12.5"

      - name: OpenTofu Init
        id: init
        run: |
          tofu -chdir=terraform init -input=false \
            -backend-config="bucket=development" \
            -backend-config="region=${{ vars.BACKEND_REGION }}" \
            -backend-config="endpoints={s3=\"${{ vars.BACKEND_ENDPOINT }}\"}" \
            -backend-config="skip_region_validation=true"

      - name: OpenTofu Apply
        id: apply
        run: tofu -chdir=terraform apply -auto-approve -input=false -var-file=environments/development.tfvars

  development-flux-bootstrap:
    name: "Flux Bootstrap Deploy (development)"
    needs: development-apply
    uses: ./.github/workflows/flux-bootstrap-apply.yml
    with:
      environment: development
    secrets: inherit

  production-plan:
    name: "OpenTofu Plan (production)"
    needs: development-apply
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: opentofu-plan-production
      cancel-in-progress: false

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.UPCLOUD_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.UPCLOUD_S3_SECRET_ACCESS_KEY }}
      UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_TOKEN }}
      TF_VAR_ssh_keys: ${{ secrets.CLUSTER_SSH_KEYS }}
      TF_VAR_admin_ip_filter: ${{ vars.ADMIN_IP_FILTER }}
      TF_VAR_cache_db_username: ${{ secrets.CACHE_DB_USERNAME }}
      TF_VAR_cache_db_password: ${{ secrets.CACHE_DB_PASSWORD }}
      TF_VAR_database_username: ${{ secrets.DATABASE_USERNAME }}
      TF_VAR_database_password: ${{ secrets.DATABASE_PASSWORD }}
      TF_VAR_azure_eso_object_id: ${{ vars.AZURE_ESO_OBJECT_ID }}
      ARM_CLIENT_ID: ${{ vars.AZURE_TF_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.12.5"

      - name: OpenTofu Init
        id: init
        run: |
          tofu -chdir=terraform init -input=false \
            -backend-config="bucket=production" \
            -backend-config="region=${{ vars.BACKEND_REGION }}" \
            -backend-config="endpoints={s3=\"${{ vars.BACKEND_ENDPOINT }}\"}" \
            -backend-config="skip_region_validation=true"

      - name: OpenTofu Validate
        id: validate
        run: tofu -chdir=terraform validate -no-color

      - name: OpenTofu Plan
        id: plan
        run: tofu -chdir=terraform plan -no-color -input=false -var-file=environments/production.tfvars

  production-approval:
    name: "Approve Production Apply"
    needs: production-plan
    runs-on: ubuntu-latest
    environment: production-approval

    steps:
      - name: Approval Received
        run: echo "Production apply approved."

  production-apply:
    name: "OpenTofu Apply (production)"
    needs: production-approval
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: opentofu-apply-production
      cancel-in-progress: false

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.UPCLOUD_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.UPCLOUD_S3_SECRET_ACCESS_KEY }}
      UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_TOKEN }}
      TF_VAR_ssh_keys: ${{ secrets.CLUSTER_SSH_KEYS }}
      TF_VAR_admin_ip_filter: ${{ vars.ADMIN_IP_FILTER }}
      TF_VAR_cache_db_username: ${{ secrets.CACHE_DB_USERNAME }}
      TF_VAR_cache_db_password: ${{ secrets.CACHE_DB_PASSWORD }}
      TF_VAR_database_username: ${{ secrets.DATABASE_USERNAME }}
      TF_VAR_database_password: ${{ secrets.DATABASE_PASSWORD }}
      TF_VAR_azure_eso_object_id: ${{ vars.AZURE_ESO_OBJECT_ID }}
      ARM_CLIENT_ID: ${{ vars.AZURE_TF_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.12.5"

      - name: OpenTofu Init
        id: init
        run: |
          tofu -chdir=terraform init -input=false \
            -backend-config="bucket=production" \
            -backend-config="region=${{ vars.BACKEND_REGION }}" \
            -backend-config="endpoints={s3=\"${{ vars.BACKEND_ENDPOINT }}\"}" \
            -backend-config="skip_region_validation=true"

      - name: OpenTofu Apply
        id: apply
        run: tofu -chdir=terraform apply -auto-approve -input=false -var-file=environments/production.tfvars

  production-flux-bootstrap:
    name: "Flux Bootstrap Deploy (production)"
    needs: production-apply
    uses: ./.github/workflows/flux-bootstrap-apply.yml
    with:
      environment: production
    secrets: inherit

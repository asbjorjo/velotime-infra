name: "OpenTofu Deploy"

on:
  push:
    branches:
      - main
    paths:
      - terraform/**

permissions:
  contents: read

jobs:
  development-plan:
    name: "OpenTofu Plan (development)"
    runs-on: ubuntu-latest
    environment: development
    concurrency:
      group: opentofu-plan-development
      cancel-in-progress: false

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.UPCLOUD_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.UPCLOUD_S3_SECRET_ACCESS_KEY }}
      UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_TOKEN }}
      TF_VAR_basename: development
      TF_VAR_ssh_keys: ${{ secrets.CLUSTER_SSH_KEYS }}
      TF_VAR_admin_ip_filter: ${{ vars.ADMIN_IP_FILTER }}
      TF_VAR_zone: ${{ vars.ZONE }}
      TF_VAR_network_gateway_plan: ${{ vars.NETWORK_GATEWAY_PLAN }}
      TF_VAR_ip_network_range: ${{ vars.NETWORK_IP_RANGE }}
      TF_VAR_cluster_plan: ${{ vars.CLUSTER_PLAN }}
      TF_VAR_cluster_node_plan: ${{ vars.CLUSTER_NODE_PLAN }}
      TF_VAR_cache_plan: ${{ vars.CACHE_PLAN }}
      TF_VAR_cache_db_username: ${{ secrets.CACHE_DB_USERNAME }}
      TF_VAR_cache_db_password: ${{ secrets.CACHE_DB_PASSWORD }}
      TF_VAR_database_plan: ${{ vars.DATABASE_PLAN }}
      TF_VAR_database_username: ${{ secrets.DATABASE_USERNAME }}
      TF_VAR_database_password: ${{ secrets.DATABASE_PASSWORD }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.12.5"

      - name: OpenTofu Init
        id: init
        run: |
          tofu -chdir=terraform init -input=false \
            -backend-config="bucket=development" \
            -backend-config="region=${{ vars.BACKEND_REGION }}" \
            -backend-config="endpoints={s3=\"${{ vars.BACKEND_ENDPOINT }}\"}" \
            -backend-config="skip_region_validation=true"

      - name: OpenTofu Validate
        id: validate
        run: tofu -chdir=terraform validate -no-color

      - name: OpenTofu Plan
        id: plan
        run: tofu -chdir=terraform plan -no-color -input=false

  development-apply:
    name: "OpenTofu Apply (development)"
    needs: development-plan
    runs-on: ubuntu-latest
    environment: development
    concurrency:
      group: opentofu-apply-development
      cancel-in-progress: false

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.UPCLOUD_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.UPCLOUD_S3_SECRET_ACCESS_KEY }}
      UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_TOKEN }}
      TF_VAR_basename: development
      TF_VAR_ssh_keys: ${{ secrets.CLUSTER_SSH_KEYS }}
      TF_VAR_admin_ip_filter: ${{ vars.ADMIN_IP_FILTER }}
      TF_VAR_zone: ${{ vars.ZONE }}
      TF_VAR_network_gateway_plan: ${{ vars.NETWORK_GATEWAY_PLAN }}
      TF_VAR_ip_network_range: ${{ vars.NETWORK_IP_RANGE }}
      TF_VAR_cluster_plan: ${{ vars.CLUSTER_PLAN }}
      TF_VAR_cluster_node_plan: ${{ vars.CLUSTER_NODE_PLAN }}
      TF_VAR_cache_plan: ${{ vars.CACHE_PLAN }}
      TF_VAR_cache_db_username: ${{ secrets.CACHE_DB_USERNAME }}
      TF_VAR_cache_db_password: ${{ secrets.CACHE_DB_PASSWORD }}
      TF_VAR_database_plan: ${{ vars.DATABASE_PLAN }}
      TF_VAR_database_username: ${{ secrets.DATABASE_USERNAME }}
      TF_VAR_database_password: ${{ secrets.DATABASE_PASSWORD }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.12.5"

      - name: OpenTofu Init
        id: init
        run: |
          tofu -chdir=terraform init -input=false \
            -backend-config="bucket=development" \
            -backend-config="region=${{ vars.BACKEND_REGION }}" \
            -backend-config="endpoints={s3=\"${{ vars.BACKEND_ENDPOINT }}\"}" \
            -backend-config="skip_region_validation=true"

      - name: OpenTofu Apply
        id: apply
        run: tofu -chdir=terraform apply -auto-approve -input=false

  # development-flux-bootstrap:
  #   name: "Flux Bootstrap Deploy (development)"
  #   needs: development-apply
  #   uses: ./.github/workflows/flux-bootstrap-apply.yml
  #   with:
  #     environment: development
  #   secrets: inherit

  production-plan:
    name: "OpenTofu Plan (production)"
    needs: development-apply
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: opentofu-plan-production
      cancel-in-progress: false

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.UPCLOUD_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.UPCLOUD_S3_SECRET_ACCESS_KEY }}
      UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_TOKEN }}
      TF_VAR_basename: production
      TF_VAR_ssh_keys: ${{ secrets.CLUSTER_SSH_KEYS }}
      TF_VAR_admin_ip_filter: ${{ vars.ADMIN_IP_FILTER }}
      TF_VAR_zone: ${{ vars.ZONE }}
      TF_VAR_network_gateway_plan: ${{ vars.NETWORK_GATEWAY_PLAN }}
      TF_VAR_ip_network_range: ${{ vars.NETWORK_IP_RANGE }}
      TF_VAR_cluster_plan: ${{ vars.CLUSTER_PLAN }}
      TF_VAR_cluster_node_plan: ${{ vars.CLUSTER_NODE_PLAN }}
      TF_VAR_cache_plan: ${{ vars.CACHE_PLAN }}
      TF_VAR_cache_db_username: ${{ secrets.CACHE_DB_USERNAME }}
      TF_VAR_cache_db_password: ${{ secrets.CACHE_DB_PASSWORD }}
      TF_VAR_database_plan: ${{ vars.DATABASE_PLAN }}
      TF_VAR_database_username: ${{ secrets.DATABASE_USERNAME }}
      TF_VAR_database_password: ${{ secrets.DATABASE_PASSWORD }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.12.5"

      - name: OpenTofu Init
        id: init
        run: |
          tofu -chdir=terraform init -input=false \
            -backend-config="bucket=production" \
            -backend-config="region=${{ vars.BACKEND_REGION }}" \
            -backend-config="endpoints={s3=\"${{ vars.BACKEND_ENDPOINT }}\"}" \
            -backend-config="skip_region_validation=true"

      - name: OpenTofu Validate
        id: validate
        run: tofu -chdir=terraform validate -no-color

      - name: OpenTofu Plan
        id: plan
        run: tofu -chdir=terraform plan -no-color -input=false

  production-approval:
    name: "Approve Production Apply"
    needs: production-plan
    runs-on: ubuntu-latest
    environment: production-approval

    steps:
      - name: Approval Received
        run: echo "Production apply approved."

  production-apply:
    name: "OpenTofu Apply (production)"
    needs: production-approval
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: opentofu-apply-production
      cancel-in-progress: false

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.UPCLOUD_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.UPCLOUD_S3_SECRET_ACCESS_KEY }}
      UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_TOKEN }}
      TF_VAR_basename: production
      TF_VAR_ssh_keys: ${{ secrets.CLUSTER_SSH_KEYS }}
      TF_VAR_admin_ip_filter: ${{ vars.ADMIN_IP_FILTER }}
      TF_VAR_zone: ${{ vars.ZONE }}
      TF_VAR_network_gateway_plan: ${{ vars.NETWORK_GATEWAY_PLAN }}
      TF_VAR_ip_network_range: ${{ vars.NETWORK_IP_RANGE }}
      TF_VAR_cluster_plan: ${{ vars.CLUSTER_PLAN }}
      TF_VAR_cluster_node_plan: ${{ vars.CLUSTER_NODE_PLAN }}
      TF_VAR_cache_plan: ${{ vars.CACHE_PLAN }}
      TF_VAR_cache_db_username: ${{ secrets.CACHE_DB_USERNAME }}
      TF_VAR_cache_db_password: ${{ secrets.CACHE_DB_PASSWORD }}
      TF_VAR_database_plan: ${{ vars.DATABASE_PLAN }}
      TF_VAR_database_username: ${{ secrets.DATABASE_USERNAME }}
      TF_VAR_database_password: ${{ secrets.DATABASE_PASSWORD }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.12.5"

      - name: OpenTofu Init
        id: init
        run: |
          tofu -chdir=terraform init -input=false \
            -backend-config="bucket=production" \
            -backend-config="region=${{ vars.BACKEND_REGION }}" \
            -backend-config="endpoints={s3=\"${{ vars.BACKEND_ENDPOINT }}\"}" \
            -backend-config="skip_region_validation=true"

      - name: OpenTofu Apply
        id: apply
        run: tofu -chdir=terraform apply -auto-approve -input=false

  production-flux-bootstrap:
    name: "Flux Bootstrap Deploy (production)"
    needs: production-apply
    uses: ./.github/workflows/flux-bootstrap-apply.yml
    with:
      environment: production
    secrets: inherit

name: "OpenTofu Apply"

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: opentofu-apply
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    name: "OpenTofu Apply"
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.UPCLOUD_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.UPCLOUD_S3_SECRET_ACCESS_KEY }}
      UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.12.5"

      - name: OpenTofu Init
        id: init
        run: tofu init -input=false -backend-config=backend.s3.tfbackend.example

      - name: OpenTofu Apply
        id: apply
        run: tofu apply -auto-approve -input=false

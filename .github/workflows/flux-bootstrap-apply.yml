name: "Flux Bootstrap Deploy"

on:
  workflow_call:
    inputs:
      environment:
        description: "Deployment environment to bootstrap with Flux."
        required: true
        type: string

permissions:
  contents: read

jobs:
  apply:
    name: "Flux Bootstrap Apply (${{ inputs.environment }})"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: flux-bootstrap-apply-${{ inputs.environment }}
      cancel-in-progress: false

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.UPCLOUD_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.UPCLOUD_S3_SECRET_ACCESS_KEY }}
      UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_TOKEN }}
      TF_VAR_flux_git_token: ${{ secrets.FLUX_GIT_TOKEN }}
      TF_VAR_flux_git_username: ${{ vars.FLUX_GIT_USERNAME }}
      TF_VAR_azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      TF_VAR_azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_azure_client_id: ${{ vars.AZURE_CLIENT_ID }}
      TF_VAR_azure_client_secret: ${{ secrets.AZURE_CLIENT_SECRET }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.12.5"

      - name: Setup UpCloud CLI
        run: |
          curl -Lo upcloud-cli_3.36.0_amd64.deb https://github.com/UpCloudLtd/upcloud-cli/releases/download/v3.36.0/upcloud-cli_3.36.0_amd64.deb
          sudo dpkg -i upcloud-cli_3.36.0_amd64.deb

      - name: Discover Runner Public IP
        id: runner-ip
        run: |
          runner_ip="$(curl --fail --silent --show-error --retry 3 https://api.ipify.org)"
          if [[ ! "$runner_ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "The runner public IP is not a valid IPv4 address: $runner_ip" >&2
            exit 1
          fi
          echo "runner_ip=$runner_ip" >> "$GITHUB_OUTPUT"

      - name: Modify Cluster Admin IP Filter
        env:
          UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t allow_ips < <(upctl kubernetes show ${{ inputs.environment }}-cluster -o json | jq -r '.control_plane_ip_filter[]')
          runner_ip="${{ steps.runner-ip.outputs.runner_ip }}"
          if [[ ! " ${allow_ips[*]} " =~ " ${runner_ip} " ]]; then
            allow_ips+=("$runner_ip")
          fi
          args=()
          for ip in "${allow_ips[@]}"; do
            args+=(--kubernetes-api-allow-ip "$ip")
          done
          upctl kubernetes modify ${{ inputs.environment }}-cluster "${args[@]}"

      - name: Wait for Cluster Admin IP Filter to Apply
        run: sleep 30

      # helm/kubernetes providers read this file directly; not managed by Terraform.
      - name: Fetch Cluster Kubeconfig
        env:
          UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_TOKEN }}
        run: upctl kubernetes config ${{ inputs.environment }}-cluster --output yaml --write "$GITHUB_WORKSPACE/flux-bootstrap/kubeconfig.yml"

      - name: OpenTofu Init
        id: init
        run: |
          tofu -chdir=flux-bootstrap init -input=false \
            -backend-config="bucket=${{ inputs.environment }}" \
            -backend-config="region=${{ vars.BACKEND_REGION }}" \
            -backend-config="endpoints={s3=\"${{ vars.BACKEND_ENDPOINT }}\"}" \
            -backend-config="skip_region_validation=true"

      - name: OpenTofu Validate
        id: validate
        run: tofu -chdir=flux-bootstrap validate -no-color

      - name: OpenTofu Apply
        id: apply
        run: tofu -chdir=flux-bootstrap apply -auto-approve -input=false -var-file=environments/${{ inputs.environment }}.tfvars

      - name: Remove Runner IP from Cluster Admin IP Filter
        if: always()
        env:
          UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_TOKEN }}
        run: |
          set -euo pipefail
          runner_ip="${{ steps.runner-ip.outputs.runner_ip }}"
          mapfile -t allow_ips < <(upctl kubernetes show ${{ inputs.environment }}-cluster -o json | jq -r --arg ip "$runner_ip" '.control_plane_ip_filter[] | select(. != $ip)')
          args=()
          for ip in "${allow_ips[@]}"; do
            args+=(--kubernetes-api-allow-ip "$ip")
          done
          upctl kubernetes modify ${{ inputs.environment }}-cluster "${args[@]}"

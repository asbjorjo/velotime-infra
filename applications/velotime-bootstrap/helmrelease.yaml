apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velotime-bootstrap
  namespace: flux-system
spec:
  interval: 1h
  releaseName: velotime-bootstrap
  targetNamespace: velotime
  storageNamespace: velotime
  timeout: 10m
  chart:
    spec:
      chart: ./charts/velotime-bootstrap
      sourceRef:
        kind: GitRepository
        name: velotime
        namespace: flux-system
      interval: 1h
      reconcileStrategy: "Revision"
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    existingSecret: velotime-bootstrap
    global:
      image:
        repository: ghcr.io/asbjorjo/
      imagePullSecrets:
        - name: ghcr

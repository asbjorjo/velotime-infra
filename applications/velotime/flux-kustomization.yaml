apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: velotime
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  path: ./applications/velotime
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: keycloak-clients
    - name: velotime-secrets
    - name: velotime-db-grant
    - name: velotime-instrumentation
  timeout: 10m
apiVersion: batch/v1
kind: Job
metadata:
  name: velotime-db-grant-permissions
  namespace: velotime
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: grant
          image: postgres:18-alpine
          command:
            - psql
            - -v
            - ON_ERROR_STOP=1
            - -c
            - GRANT ALL PRIVILEGES ON DATABASE "$(VELOTIME_DB_NAME)" TO "$(VELOTIME_DB_USER)";
          env:
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: velotime-db-secret
                  key: host
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  name: velotime-db-secret
                  key: port
            - name: VELOTIME_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: velotime-db-secret
                  key: database
            - name: VELOTIME_DB_USER
              valueFrom:
                secretKeyRef:
                  name: velotime-db-secret
                  key: username
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: velotime-db-admin-secret
                  key: database
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: velotime-db-admin-secret
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: velotime-db-admin-secret
                  key: password

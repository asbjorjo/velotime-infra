apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keycloak-realm-secrets
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  path: ./applications/keycloak-realm-secrets
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
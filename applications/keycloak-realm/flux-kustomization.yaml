apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keycloak-realm
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  path: ./applications/keycloak-realm
  prune: true
  wait: true
  healthCheckExprs:
    - apiVersion: k8s.keycloak.org/v2beta1
      kind: KeycloakRealmImport
      failed: >-
        has(status.conditions) &&
        status.conditions.exists(condition, condition.type == 'HasErrors' && condition.status == 'True')
      current: >-
        has(status.conditions) &&
        status.conditions.exists(condition, condition.type == 'Done' && condition.status == 'True')
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
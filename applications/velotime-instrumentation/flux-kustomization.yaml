apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: velotime-instrumentation
  namespace: flux-system
spec:
  interval: 1h
  path: ./applications/velotime-instrumentation
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: velotime-namespace
  timeout: 5m
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "velotime.fullname" . }}
  labels:
    {{- include "velotime.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "velotime.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "velotime.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.global.image.repository }}{{ .Chart.Name }}:{{ .Values.global.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- with .Values.ports }}
        ports:
          {{- toYaml . | nindent 8 }}
        {{- end }}
        envFrom:
          - configMapRef:
              name: {{ include "velotime.fullname" . }}
          - secretRef:
              name: {{ .Values.existingSecret | default (include "velotime.fullname" .) }}
      initContainers:
      {{- range .Values.migrations }}
      - name: {{ $.Chart.Name }}-{{ . }}-migration
        image: "{{ $.Values.global.image.repository }}velotime-module-{{ . }}-migration:{{ $.Values.global.image.tag }}"
        imagePullPolicy: {{ $.Values.migration.image.pullPolicy }}
        envFrom:
          - configMapRef:
              name: {{ include "velotime.fullname" $ }}
          - secretRef:
            name: {{ $.Values.existingSecret | default (include "velotime.fullname" $) }}
      {{- end -}}
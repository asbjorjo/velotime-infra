apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-bootstrap-admin
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault
  target:
    name: keycloak-bootstrap-admin
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        client-id: velotime-bootstrap-admin
        client-secret: "{{ .secret }}"
  data:
    - secretKey: secret
      remoteRef:
        key: keycloak-bootstrap-admin-client-secret

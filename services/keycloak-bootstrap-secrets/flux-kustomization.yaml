apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keycloak-bootstrap-secrets
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  path: ./services/keycloak-bootstrap-secrets
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m

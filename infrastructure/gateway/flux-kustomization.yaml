apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway
  namespace: flux-system
spec:
  interval: 1h
  path: ./infrastructure/gateway
  prune: true
  wait: true
  healthCheckExprs:
    - apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      current: >-
        has(status.conditions) &&
        status.conditions.exists(condition,
          condition.type == 'Accepted' && condition.status == 'True' &&
          has(condition.observedGeneration) && condition.observedGeneration == metadata.generation) &&
        status.conditions.exists(condition,
          condition.type == 'Programmed' && condition.status == 'True' &&
          has(condition.observedGeneration) && condition.observedGeneration == metadata.generation)
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: gateway-api-crds
    - name: cert-manager-issuer
  timeout: 5m

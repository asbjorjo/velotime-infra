apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 1h
  releaseName: cert-manager
  targetNamespace: cert-manager
  storageNamespace: cert-manager
  timeout: 5m
  chart:
    spec:
      chart: cert-manager
      version: "v1.16.2"
      sourceRef:
        kind: HelmRepository
        name: cert-manager
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 0
  upgrade:
    remediation:
      retries: 0
    crds: CreateReplace
  values:
    crds:
      enabled: true
    # Required for the ClusterIssuer's gatewayHTTPRoute ACME solver to reconcile Gateway API types.
    config:
      enableGatewayAPI: true

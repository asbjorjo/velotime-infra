apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: azure-keyvault
spec:
  provider:
    azurekv:
      authType: ServicePrincipal
      authSecretRef:
        clientId:
          name: external-secrets-azure-config
          namespace: flux-system
          key: clientId
        clientSecret:
          name: external-secrets-azure-config
          namespace: flux-system
          key: clientSecret
